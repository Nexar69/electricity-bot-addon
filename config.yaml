name: Electricity Telegram Bot
version: "1.5.0"
slug: electricity_telegram_bot
description: Telegram bot for monitoring electricity
startup: application
boot: auto

arch:
  - amd64

options:
  telegram_token: ""
  chat_id: ""
  ha_token: ""
  voltage_sensor: "sensor.huawei_grid_voltage_l3"
  off_voltage: 150
  low_voltage_threshold: 200
  history_hours: 24
  dashboard_update_minutes: 5
  dashboard_reset_time: "08:00"
  outage_confirmation_seconds: 10

  developer_mode: false
  developer_fake_voltage: -1
  developer_reset_dashboard_on_start: false
  developer_send_test_alerts_on_start: false

schema:
  telegram_token: str
  chat_id: str
  ha_token: password
  voltage_sensor: str
  off_voltage: int
  low_voltage_threshold: int
  history_hours: int
  dashboard_update_minutes: int
  dashboard_reset_time: str
  outage_confirmation_seconds: int

  developer_mode: bool
  developer_fake_voltage: float
  developer_reset_dashboard_on_start: bool
  developer_send_test_alerts_on_start: bool
